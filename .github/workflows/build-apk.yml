name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev libncurses6 libtinfo6 \
            cmake libffi-dev libssl-dev ccache patchelf

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --break-system-packages --force-reinstall "pip==24.3.1"
          python -m pip install --break-system-packages wheel setuptools "cython>=3.0.11" buildozer
          python -m pip --version

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: domain-control-apk
          path: bin/*.apk
